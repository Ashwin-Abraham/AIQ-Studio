<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="56mm" height="12mm" viewBox="0 0 56 12" role="img" aria-labelledby="title desc">
  <title id="title">Scale bar A — alternating</title>
  <desc id="desc">Black-and-white 500 metre scale bar example at 1:10,000.</desc>
  <g data-example-scale-denominator="10000" data-example-ground-length-m="500">
    <path d="M2 2H14.5V5H2ZM27 2H39.5V5H27Z" fill="#000000"/>
    <path d="M14.5 2H27V5H14.5ZM39.5 2H52V5H39.5Z" fill="#FFFFFF"/>
    <rect x="2" y="2" width="50" height="3" fill="none" stroke="#000000" stroke-width="0.25" vector-effect="non-scaling-stroke"/>
    <path d="M14.5 2V5M27 2V5M39.5 2V5" fill="none" stroke="#000000" stroke-width="0.2" vector-effect="non-scaling-stroke"/>
    <text x="2" y="9" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="2.8">0</text>
    <text x="27" y="9" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="2.8">250</text>
    <text x="52" y="9" text-anchor="end" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="2.8">500 m</text>
  </g>
</svg>
