<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" fill="none">
  <title>AIQ Concept Designer — workspace mockup</title>
  <desc>A required base selector, drawing canvas, three option tabs, layer switches, per-option stages and a chat with an option selector. Sample design geometry is illustrative.</desc>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#d6dcce"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" stroke="#b88645" stroke-width="1.5"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#28463c}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:600;fill:#7d8b76}.muted{fill:#819078;font-size:13px}.label{font-size:14px}.small{font-size:11px}.white{fill:white}.title{font-size:32px;font-weight:600;letter-spacing:-1px}</style>
  </defs>
  <rect width="1440" height="1240" fill="#f3f4ef"/>
  <g id="header"><text x="70" y="48" class="eyebrow">AIQ STUDIO / DESIGN TOOLS</text><text x="70" y="94" class="title">Concept designer</text><rect x="367" y="70" width="108" height="27" rx="13" fill="#e4e9d8"/><text x="386" y="88" class="small">WORKSPACE</text><text x="70" y="126" class="muted">One base. Different directions. Develop your ideas with an agent.</text><rect x="1200" y="65" width="170" height="42" rx="8" fill="white" stroke="#ccd5c6"/><text x="1224" y="91" class="label">Export session ↓</text></g>
  <g id="base-selection"><rect x="70" y="156" width="1300" height="90" rx="12" fill="white" stroke="#d5dccd"/><text x="92" y="183" class="eyebrow">01 / BASE SELECTION</text><text x="92" y="215" class="label">Choose a base to begin</text><rect x="330" y="179" width="190" height="44" rx="8" fill="#f8f9f3" stroke="#d7ddcf"/><text x="358" y="207" class="label">↑ Upload sketch</text><rect x="532" y="179" width="215" height="44" rx="8" fill="#e7eddf" stroke="#7a9470"/><text x="555" y="207" class="label">◇ Site boundary⌄</text><rect x="759" y="179" width="139" height="44" rx="8" fill="#f8f9f3" stroke="#d7ddcf"/><text x="785" y="207" class="label">＋ No base</text><text x="942" y="196" class="small">BOUNDARY SOURCE</text><text x="942" y="218" class="muted">Upload · Draw · Rhino selection</text></g>
  <g id="canvas"><rect x="70" y="268" width="1300" height="576" rx="12" fill="#fcfcf7" stroke="#d5dccd"/><path d="M70 320H1370" stroke="#dde3d3"/><circle cx="96" cy="294" r="4" fill="#648354"/><text x="112" y="299" class="label">Site boundary</text><text x="216" y="299" class="muted">/ shared base</text><text x="1191" y="299" class="small">OPTION 01 · EXPLORE</text><rect x="71" y="321" width="1099" height="467" fill="url(#grid)"/>
    <g id="toolbar"><rect x="92" y="339" width="346" height="52" rx="9" fill="white" stroke="#d8dece"/><rect x="98" y="345" width="42" height="40" rx="6" fill="#285b4b"/><path d="M108 368Q112 352 118 367T132 357" stroke="white" stroke-width="2"/><path d="M157 373L176 353M206 354L223 357L216 375L200 370Z" stroke="#43604d" stroke-width="2"/><circle cx="256" cy="364" r="10" stroke="#43604d" stroke-width="2"/><text x="292" y="372" font-size="22">T</text><path d="M331 369L343 354L353 362L343 375H336Z" stroke="#43604d" stroke-width="2"/><path d="M392 356Q415 361 397 374M392 356L399 352M392 356L397 363" stroke="#43604d" stroke-width="2"/></g>
    <g id="underlay" stroke="#c8cebf" stroke-width="2"><path d="M197 445L569 719M204 421L589 701M906 411L765 714"/><path d="M313 417L373 457L350 491L290 451Z M217 515L276 558L248 594L189 550Z M587 407L639 445L618 475L568 439Z M715 680L765 713L741 746L691 713Z" fill="#eef0e7"/></g>
    <g id="ai-overlay"><path d="M433 448L721 424L834 568L640 714L385 536Z" fill="#dfe8cf" fill-opacity=".35" stroke="#7e976b" stroke-width="2" stroke-dasharray="10 7"/><path d="M466 489L535 461L583 541L514 570Z M601 463L674 450L705 540L632 553Z M641 596L717 559L751 609L676 649Z" fill="#e0e8d3" stroke="#587d5f" stroke-width="2"/><path d="M477 493L535 469L568 527 M608 470L669 461L691 526 M652 599L714 570L738 602" stroke="#9fb58b" stroke-width="4"/><ellipse cx="601" cy="596" rx="37" ry="28" fill="#e6ebcd"/><text x="568" y="600" class="small">Courtyard</text><text x="682" y="395" class="small">OPEN EDGE</text><path d="M711 403L700 421" stroke="#779168"/><circle cx="419" cy="540" r="12" fill="#d3dfc4"/><circle cx="440" cy="568" r="16" fill="#d3dfc4"/><circle cx="466" cy="597" r="12" fill="#d3dfc4"/></g>
    <g id="human-input"><path d="M379 448Q355 427 336 406M753 640Q795 655 838 678" stroke="#b88645" stroke-width="4" marker-end="url(#arrow)"/><path d="M509 647Q544 670 584 659" stroke="#b88645" stroke-width="3"/><text x="307" y="423" font-size="14" transform="rotate(-9 307 423)" fill="#b88645">Arrival?</text><text x="843" y="684" font-size="14" fill="#b88645">Keep this view</text></g>
    <text x="92" y="766" class="eyebrow">CONCEPT WORKSPACE</text><text x="920" y="766" class="small">Diagram only · scale not set</text>
    <g id="stages"><path d="M1170 320V788" stroke="#dde3d3"/><text x="1195" y="358" class="eyebrow">DESIGN STAGES</text><path d="M1210 395V643" stroke="#d5ddcb" stroke-width="2"/>
      <circle cx="1210" cy="402" r="13" fill="#e2ead6"/><text x="1204" y="407" class="small">✓</text><text x="1236" y="407" class="label">Base</text>
      <circle cx="1210" cy="462" r="13" fill="#285b4b"/><text x="1207" y="466" class="small white">2</text><text x="1236" y="467" class="label" font-weight="700">Explore</text>
      <circle cx="1210" cy="522" r="13" fill="#fcfcf7" stroke="#c9d2bf"/><text x="1207" y="526" class="small">3</text><text x="1236" y="527" class="muted">Develop</text>
      <circle cx="1210" cy="582" r="13" fill="#fcfcf7" stroke="#c9d2bf"/><text x="1207" y="586" class="small">4</text><text x="1236" y="587" class="muted">Review</text>
      <circle cx="1210" cy="642" r="13" fill="#fcfcf7" stroke="#c9d2bf"/><text x="1207" y="646" class="small">5</text><text x="1236" y="647" class="muted">Select</text><text x="1195" y="717" class="small">Progress belongs</text><text x="1195" y="735" class="small">to this option.</text></g>
    <g id="option-tabs"><path d="M70 788H1370" stroke="#d8dfcf"/><rect x="92" y="808" width="30" height="16" rx="8" fill="#285b4b"/><circle cx="114" cy="816" r="6" fill="white"/><text x="135" y="821" class="label">Compare options</text><rect x="312" y="799" width="142" height="35" rx="7" fill="#285b4b"/><text x="348" y="822" class="label white">Option 01</text><rect x="466" y="799" width="142" height="35" rx="7" fill="#f3f5ee"/><text x="502" y="822" class="label">Option 02</text><rect x="620" y="799" width="142" height="35" rx="7" fill="#f3f5ee"/><text x="656" y="822" class="label">Option 03</text><text x="1160" y="821" class="small">3 independent directions</text></g>
  </g>
  <g id="layer-controls"><text x="70" y="883" class="eyebrow">VISIBLE LAYERS</text><rect x="211" y="868" width="17" height="17" rx="4" fill="#285b4b"/><text x="214" y="881" class="small white">✓</text><text x="238" y="882" class="label">Underlay</text><rect x="347" y="868" width="17" height="17" rx="4" fill="#285b4b"/><text x="350" y="881" class="small white">✓</text><text x="374" y="882" class="label">AI overlay</text><rect x="490" y="868" width="17" height="17" rx="4" fill="#285b4b"/><text x="493" y="881" class="small white">✓</text><text x="517" y="882" class="label">Human input</text><text x="1237" y="882" class="label">↑ Import AI SVG</text></g>
  <g id="chat"><rect x="70" y="913" width="1300" height="262" rx="12" fill="white" stroke="#d5dccd"/><text x="94" y="944" class="eyebrow">DESIGN CONVERSATION</text><text x="94" y="977" font-size="23">Develop this direction</text><text x="1085" y="956" class="muted">Working on</text><rect x="1177" y="931" width="167" height="40" rx="7" fill="#f8faf4" stroke="#d5ddcc"/><text x="1200" y="956" class="label">Option 01⌄</text><text x="94" y="1013" class="muted">Explore access, massing and open space. Keep each option’s brief and decisions together.</text><rect x="676" y="1034" width="668" height="45" rx="9" fill="#eff3e8"/><text x="697" y="1062" class="label">Keep the courtyard open and test an entrance from the west.</text><rect x="94" y="1097" width="1083" height="52" rx="8" fill="#fafbf7" stroke="#d5ddcc"/><text x="112" y="1129" class="muted">Describe your idea for this option…</text><rect x="1191" y="1097" width="153" height="52" rx="8" fill="#285b4b"/><text x="1220" y="1129" class="label white">Add note ↑</text></g>
  <text x="70" y="1205" class="small">UI PROPOSAL / 03 OCT 2026</text><text x="859" y="1205" class="muted">Prototype: local notes · agent connection to be defined</text>
</svg>
